<style>

  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e645d 0, var(--bg) 46%, #092b28 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
  }
  .wrap { width: min(1420px, 96%); margin: 0 auto; padding: 28px 0 42px; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 3vw, 42px); }
  .sub { margin: 0; color: var(--muted); font-size: 15px; }
  .grid {
    direction: ltr;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    direction: rtl;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 10px;
    padding: 0 0 14px;
    min-height: 346px;
    background: rgba(255,255,255,.09);
    color: white;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 24px rgba(0,0,0,.16);
    transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); background: rgba(255,255,255,.13); }
  .card:active { transform: scale(.985); }
  .card.playing { outline: 3px solid rgba(244,201,93,.95); outline-offset: 2px; }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #e7e7e7; }
  .num {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 2;
    min-width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: rgba(0,0,0,.56);
    font-weight: 850;
    font-size: 13px;
  }
  .thai { display: block; margin-top: 13px; font-size: 31px; font-weight: 850; line-height: 1.08; }
  .meaning {
    direction: ltr;
    display: block;
    min-height: 38px;
    margin: 7px 12px 0;
    font-size: 15px;
    line-height: 1.25;
    font-weight: 800;
    color: rgba(255,255,255,.78);
  }
  .roman {
    direction: ltr;
    display: block;
    font-size: 22px;
    line-height: 1.15;
    font-weight: 900;
    color: #fff;
  }
  .hint {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    margin-top: 12px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.82);
    font-size: 13px;
    font-weight: 750;
  }
  .answers {
    direction: ltr;
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    display: grid;
    gap: 5px;
    min-height: 76px;
    place-items: center;
    padding: 10px;
    border-radius: 10px;
    background: rgba(7,28,26,.92);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }
  .card.revealed .answers { opacity: 1; transform: translateY(0); }
  .card.revealed .hint { visibility: hidden; }
  .english { direction: ltr; }
  #status { text-align: center; min-height: 24px; margin-top: 20px; color: var(--muted); font-size: 14px; }
  @media (max-width: 1150px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { min-height: 316px; }
    .thai { font-size: 28px; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .wrap { width: min(430px, 94%); }

</style>

const player = document.getElementById("player");
const status = document.getElementById("status");
const revealTimers = new WeakMap();

function resetPlaying() {
  document.querySelectorAll(".card").forEach(card => card.classList.remove("playing"));
}

function revealCard(button) {
  document.querySelectorAll(".card.revealed").forEach(card => {
    if (card !== button) {
      const timer = revealTimers.get(card);
      if (timer) clearTimeout(timer);
      card.classList.remove("revealed");
    }
  });
  const previousTimer = revealTimers.get(button);
  if (previousTimer) clearTimeout(previousTimer);
  button.classList.add("revealed");
  revealTimers.set(button, setTimeout(() => {
    button.classList.remove("revealed");
    revealTimers.delete(button);
  }, 3000));
}

function playWord(index, button) {
  const item = words[index];
  resetPlaying();
  button.classList.add("playing");
  revealCard(button);
  status.textContent = "מנגן: " + item.thai + " (" + item.roman + ")";
  player.pause();
  player.src = item.audio;
  player.currentTime = 0;
  const playPromise = player.play();
  if (playPromise && playPromise.catch) playPromise.catch(failAudio);
}

function failAudio() {
  resetPlaying();
  status.textContent = "לא הצלחתי לנגן את קובץ השמע. רענן את העמוד ונסה שוב.";
}

player.addEventListener("ended", () => {
  resetPlaying();
  status.textContent = "";
});
player.addEventListener("error", failAudio);
